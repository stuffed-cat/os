[package]
name = "kernel-bin"
version = "0.1.0"
edition = "2021"
authors = ["stuffed-cat <dev@stuffedcat.dev>"]
description = "Bare-metal entrypoint and boot harness for the hybrid kernel"
license = "MIT"

[features]
default = []
boot = []

[dependencies]
kernel = { path = "../kernel", default-features = false, features = ["boot"] }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
spin = "0.9"
uart_16550 = "0.2"
linked_list_allocator = "0.10"
arrayvec = { version = "0.7", default-features = false }
itoa = { version = "1.0", default-features = false }
multiboot2 = { path = "../third_party/multiboot2/multiboot2", default-features = false }

