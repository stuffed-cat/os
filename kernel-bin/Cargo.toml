[package]
name = "kernel-bin"
version = "0.1.0"
edition = "2021"
authors = ["stuffed-cat <dev@stuffedcat.dev>"]
description = "Bare-metal entrypoint and boot harness for the hybrid kernel"
license = "MIT"

[features]
default = []
boot = []

[dependencies]
kernel = { path = "../kernel", default-features = false, features = ["baremetal"] }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
spin = "0.9"
uart_16550 = "0.2"
linked_list_allocator = "0.10"
bootloader_api = "0.11"
arrayvec = { version = "0.7", default-features = false }
itoa = { version = "1.0", default-features = false }

[build-dependencies]
bootloader = "0.11"

[package.metadata.bootloader]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem", "panic_immediate_abort"]
target = "x86_64-unknown-none"

[package.metadata.bootimage]
build-command = ["build", "--target", "x86_64-unknown-none"]

