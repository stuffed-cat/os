[package]
name = "kernel"
version = "0.2.0"
edition = "2021"
authors = ["stuffed-cat <dev@stuffedcat.dev>"]
description = "Hybrid micro/monolithic kernel core for a POSIX-like x86-64 OS"
license = "MIT"

[lib]
name = "kernel"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
hardware = ["x86_64/abi_x86_interrupt"]
baremetal = ["alloc", "hardware"]

[dependencies]
bitflags = "2.4"
spin = "0.9"
log = { version = "0.4", default-features = false }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
uart_16550 = "0.2"
