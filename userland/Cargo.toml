[package]
name = "userland"
version = "0.2.0"
edition = "2021"
authors = ["stuffed-cat <dev@stuffedcat.dev>"]
description = "Prototype POSIX-ish userland for the hybrid kernel"
license = "MIT"

[features]
default = ["std"]
std = ["serde", "bincode", "libc-lite"]
baremetal = ["pc-keyboard"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", default-features = false, optional = true }
libc-lite = { path = "../libc-lite", optional = true }
pc-keyboard = { version = "0.7", default-features = false, optional = true }

[[bin]]
name = "userland"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "bash"
path = "src/bin/bash.rs"
required-features = ["std"]

[[bin]]
name = "ls"
path = "src/bin/ls.rs"
required-features = ["std"]

[[bin]]
name = "cat"
path = "src/bin/cat.rs"
required-features = ["std"]

[[bin]]
name = "help"
path = "src/bin/help.rs"
required-features = ["std"]

[[bin]]
name = "history"
path = "src/bin/history.rs"
required-features = ["std"]

[[bin]]
name = "pwd"
path = "src/bin/pwd.rs"
required-features = ["std"]

[[bin]]
name = "cd"
path = "src/bin/cd.rs"
required-features = ["std"]

[[bin]]
name = "echo"
path = "src/bin/echo.rs"
required-features = ["std"]

[[bin]]
name = "touch"
path = "src/bin/touch.rs"
required-features = ["std"]

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"
required-features = ["std"]

[[bin]]
name = "rmdir"
path = "src/bin/rmdir.rs"
required-features = ["std"]

[[bin]]
name = "rm"
path = "src/bin/rm.rs"
required-features = ["std"]

[[bin]]
name = "cp"
path = "src/bin/cp.rs"
required-features = ["std"]

[[bin]]
name = "mv"
path = "src/bin/mv.rs"
required-features = ["std"]

[[bin]]
name = "reboot"
path = "src/bin/reboot.rs"
required-features = ["std"]

[[bin]]
name = "shutdown"
path = "src/bin/shutdown.rs"
required-features = ["std"]

[[bin]]
name = "sh"
path = "src/bin/sh.rs"
required-features = ["std"]

[[bin]]
